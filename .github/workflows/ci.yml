name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Detect Go module
        id: gomod
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no go.mod)
        if: steps.gomod.outputs.present != 'true'
        run: echo "go.mod not found; skipping Go checks"

      - name: Run checks
        if: steps.gomod.outputs.present == 'true'
        run: mise run check
